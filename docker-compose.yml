services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vkr-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - vkr-network
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: vkr-backend-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vkr-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: vkr-backend-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vkr_family_apteka}
      MYSQL_USER: ${DB_USERNAME:-vkr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vkr-network

  redis:
    image: redis:alpine
    container_name: vkr-backend-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vkr-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vkr-network:
    driver: bridge
