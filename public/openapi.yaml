    post:
      tags:
      - MedicineBoxMembers
      summary: Приглашение участника в семейную аптечку
      description: 'Требует согласия 152-ФЗ на синхронизацию (`sync_enabled = true`)
        у владельца и приглашаемого. Доступно только владельцу (`owner`). Роли: `editor`,
        `viewer`.'
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  format: email
                  example: husband@family.test
                role:
                  type: string
                  enum:
                  - editor
                  - viewer
                  example: editor
      responses:
        '201':
          description: Участник успешно добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '200':
          description: Роль участника обновлена либо нейтральный ответ при отсутствии
            адреса (защита от перебора DEF-12)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        '403':
          description: Запрещено политикой или отключена синхронизация 152-ФЗ
