          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Курс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      tags:
      - IntakeCourses
      summary: Удаление / завершение курса приёма
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 3
      responses:
        '200':
          description: Курс приёма успешно удален
          content:
            application/json:
              schema:
