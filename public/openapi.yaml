                  - travel
                  - custom
                  example: car
                description:
                  type: string
                  example: Аптечка первой помощи в багажнике
      responses:
        '201':
          description: Аптечка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/MedicineBox'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
