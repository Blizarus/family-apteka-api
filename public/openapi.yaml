                  type: string
                  example: Верхний шкаф кухни
      responses:
        '200':
          description: Аптечка обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/MedicineBox'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - MedicineBoxes
      summary: Удаление аптечки (Soft-delete)
