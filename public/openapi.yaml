      - Reports
      summary: Аналитический отчёт комплаенса и приверженности лечению (Adherence
        Report)
      description: 'Формирует структурированную аналитику: комплаентность (adherence_rate),
        текущая непрерывная серия приёмов (streak_days), посуточная статистика и разбивка
