            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Препарат 'Ибупрофен' успешно удален из справочника.
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (не администратор или внешний IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Препарат не найден в каталоге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
