  /medication-safety/check:
    post:
      tags:
      - MedicationSafety
      summary: Превентивный клинический анализ безопасности (CDS)
      description: 'Проверяет совместимость лекарства с профилем пациента перед назначением:
        дублирование МНН и АТХ-групп, критические аллергии на активные вещества (пенициллины,
        НПВП), аллергии на вспомогательные эксципиенты (лактоза, цитрусовые ароматизаторы)
        и коморбидные патологии (астма, гастрит, гипертензия). Защищено от IDOR.'
      security:
      - sanctumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_id
              properties:
                profile_id:
                  type: integer
                  example: 1
                  description: Идентификатор профиля члена семьи
                medicine_id:
                  type: integer
                  example: 5
                  description: Идентификатор физической упаковки в аптечке
                reference_medicine_id:
                  type: integer
                  example: 1
                  description: Либо идентификатор препарата из каталога ГРЛС
      responses:
        '200':
          description: Клинический отчет о рисках и противопоказаниях
          content:
