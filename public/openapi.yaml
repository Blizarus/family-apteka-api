          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: 'Превышен лимит запросов (Rate Limiting: 6 попыток в минуту)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
