          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /intake-courses/{id}/extend:
    post:
      tags:
      - IntakeCourses
      summary: Продление курса приёма лекарств
      description: 'Продлевает активный курс приёма: генерирует слоты расписания и
        логи приёмов на 14 дней вперёд от даты последнего запланированного приёма.
