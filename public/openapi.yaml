      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
        description: Идентификатор курса приёма
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  default: 14
                  example: 14
                  description: Количество дней продления курса
      responses:
        '200':
          description: Курс успешно продлён, сгенерированы новые логи
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Курс приёма успешно продлён.
                  data:
                    $ref: '#/components/schemas/IntakeCourse'
                  logs_created_count:
                    type: integer
                    example: 14
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Курс приёма не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Нельзя продлить завершенный курс приёма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /intake-logs:
    get:
      tags:
      - IntakeLogs
      summary: Журнал приёмов лекарств (на день или история)
      description: По умолчанию возвращает список приёмов на сегодня (`date=today`).
        При запросе истории (`?history=1` или `?date=history`) переключается в пагинированный
        режим по 50 записей.
      security:
      - sanctumAuth: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
        example: today
        description: '''today'', ''YYYY-MM-DD'', ''history'' или ''all'''
      - name: profile_id
        in: query
        required: false
        schema:
          type: integer
        example: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - scheduled
          - taken
          - skipped
      - name: history
        in: query
        required: false
        schema:
          type: boolean
        description: Режим полной истории с пагинацией
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Список логов на дату либо пагинация истории
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2026-10-29'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntakeLog'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /intake-logs/quick:
    post:
      tags:
      - IntakeLogs
      summary: Разовый приём по требованию (PRN / Quick Intake)
      description: Фиксирует разовый симптоматический приём лекарства («по требованию»),
        автоматически создает или находит PRN-курс, создает запись в журнале со статусом
        taken и атомарно списывает дозу из физического остатка препарата в аптечке.
        Защищено от IDOR и дублирования запросов (Idempotency).
      security:
      - sanctumAuth: []
      parameters:
      - &id001
        name: X-Idempotency-Key
        in: header
        required: false
        description: Уникальный клиентский ключ идемпотентности (UUIDv4) для защиты
          от повторного списания остатка при сетевых дублях
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - medicine_id
              - profile_id
              properties:
                medicine_id:
                  type: integer
                  example: 1
                  description: Идентификатор лекарства в аптечке
                profile_id:
                  type: integer
                  example: 1
                  description: Идентификатор профиля члена семьи
                quantity:
                  type: number
                  format: float
                  minimum: 0.1
                  maximum: 10.0
                  default: 1.0
                  example: 1.0
                  description: Принятая доза (по умолчанию 1.0)
                symptom:
                  type: string
                  maxLength: 255
                  example: Головная боль
                  description: Симптом или причина приёма
                taken_at:
                  type: string
                  format: date-time
                  example: '2026-10-29T20:30:00Z'
                  description: Время приёма (по умолчанию текущее)
      responses:
        '201':
          description: Разовый приём успешно зафиксирован, остаток списан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Разовый приём успешно зафиксирован, остаток списан.
                  data:
                    $ref: '#/components/schemas/IntakeLog'
                  remaining_quantity:
                    type: number
                    format: float
                    example: 9.0
        '403':
          description: 'IDOR: Профиль или аптечка не принадлежат пользователю'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': &id002
          description: Конфликт идемпотентности — операция с данным ключом уже обрабатывается
            или завершена с другим результатом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных параметров или несовпадение контрольного
            хеша idempotency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /intake-logs/{id}:
    get:
      tags:
      - IntakeLogs
      summary: Просмотр записи о приёме
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 42
      responses:
        '200':
          description: Детали лога приёма
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IntakeLog'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /intake-logs/{id}/take:
    post:
      tags:
      - IntakeLogs
      summary: Отметка о приёме лекарства (Take) и списание остатка
      description: В атомарной транзакции статус лога переводится в `taken`, фиксируется
        `taken_time`, а из физического остатка препарата (`medicines.quantity`) вычитается
        доза. При обнулении остатка статус меняется на `finished`. Защищено заголовком
        идемпотентности X-Idempotency-Key.
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 42
      - *id001
      responses:
        '200':
          description: Приём зафиксирован, остаток списан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Приём лекарства успешно зафиксирован. Остаток списан.
                  data:
                    $ref: '#/components/schemas/IntakeLog'
                  remaining_quantity:
                    type: number
                    format: float
                    example: 19.0
        '403':
          description: 'IDOR: Приём не относится к профилям пользователя'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': *id002
        '422':
          description: Ошибка валидации или несоответствие idempotency_key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /intake-logs/{id}/skip:
    post:
      tags:
      - IntakeLogs
      summary: Пропуск приёма лекарства с фиксацией причины
      description: Статус переводится в `skipped`, сохраняется указанная причина пропуска
        (например, плохое самочувствие). Остаток препарата в аптечке не списывается.
        Защищено заголовком идемпотентности X-Idempotency-Key.
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 42
      - *id001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
                  example: Тошнота после еды
      responses:
        '200':
          description: Приём отмечен как пропущенный
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/IntakeLog'
        '403':
          description: 'IDOR: Доступ запрещен'
