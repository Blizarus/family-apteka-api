            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - MedicineBoxes
      summary: Обновление параметров аптечки
      description: Доступно владельцу (`owner`) и редактору (`editor`).
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Домашняя аптечка (Кухня)
                box_type:
                  type: string
                  enum:
                  - home
                  - car
