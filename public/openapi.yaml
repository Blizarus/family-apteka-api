  /medicines:
    get:
      tags:
      - Medicines
      summary: Список препаратов в аптечках пользователя с пагинацией
      description: Защита от IDOR. Поддерживает поиск по справочнику ГРЛС и расшифрованному
        наименованию (AES-256), фильтрацию по аптечке, статусу и истекающим срокам
        (в пределах 30 дней).
      security:
      - sanctumAuth: []
      parameters:
      - name: medicine_box_id
        in: query
        required: false
        schema:
          type: integer
        description: Фильтр по конкретной аптечке
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - expiring
          - expired
          - finished
          - disposed
      - name: expiring
        in: query
        required: false
        schema:
          type: boolean
        description: Только истекающие в ближайшие 30 дней
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Поисковая строка (поиск по ГРЛС и зашифрованному custom_trade_name)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 25
          maximum: 100
      responses:
        '200':
          description: Пагинированный список препаратов
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medicine'
                  per_page:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 10
        '403':
          description: 'IDOR: Доступ к указанной аптечке запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Medicines
      summary: Добавление лекарственного препарата в аптечку
      description: Поля `custom_trade_name` и `notes` шифруются алгоритмом AES-256
        (Data-at-Rest). Проверяется право редактирования аптечки.
      security:
      - sanctumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - medicine_box_id
              - quantity
              - quantity_unit
              - expiration_date
              properties:
                medicine_box_id:
                  type: integer
                  example: 1
                reference_medicine_id:
                  type: integer
                  nullable: true
                  example: 1
                custom_trade_name:
                  type: string
                  example: Парацетамол Экстра
                  description: Шифруется AES-256
                barcode:
                  type: string
                  example: '4607008360012'
                quantity:
                  type: number
                  format: float
                  minimum: 0.001
                  example: 20.0
                quantity_unit:
                  type: string
                  enum:
                  - pill
                  - ml
                  - mg
                  - ampoule
                  - unit
                  example: pill
                expiration_date:
                  type: string
                  format: date
                  example: '2027-08-30'
                opened_at:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-10-20'
                days_after_opening:
                  type: integer
                  minimum: 1
                  example: 90
                low_stock_threshold:
                  type: number
                  format: float
                  example: 3.0
                storage_condition:
                  type: string
                  enum:
                  - room
                  - fridge
                  - dark_place
                  example: room
                notes:
                  type: string
                  example: Принимать строго при температуре выше 38.5C
                  description: Шифруется AES-256
      responses:
        '201':
          description: Препарат успешно добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Medicine'
        '403':
          description: 'IDOR: Нет прав на изменение указанной аптечки'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
