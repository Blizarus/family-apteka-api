  /intake-logs/{id}/snooze:
    post:
      tags:
      - IntakeLogs
      summary: Откладывание приёма лекарства на +N минут (Snooze)
      description: Сдвигает `scheduled_time` на указанное количество минут (по умолчанию
        +15 мин, от 5 до 120 мин) для напоминания в мобильном приложении. Защищено
        заголовком идемпотентности X-Idempotency-Key.
      security:
      - sanctumAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 42
      - *id001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: integer
                  minimum: 5
                  maximum: 120
                  default: 15
                  example: 15
      responses:
        '200':
          description: Время приёма сдвинуто
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Приём лекарства успешно отложен на 15 мин.
                  data:
                    $ref: '#/components/schemas/IntakeLog'
        '403':
          description: 'IDOR: Доступ запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': *id002
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
