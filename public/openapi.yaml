                rule:
                  type: string
                  example: после еды
                notes:
                  type: string
                  example: Принимать строго после еды
      responses:
        '200':
          description: Курс приёма успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Курс приёма успешно обновлен.
                  data:
                    $ref: '#/components/schemas/IntakeCourse'
        '401':
