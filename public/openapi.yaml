openapi: 3.1.0
info:
  title: REST API «Семейная Аптечка» (Family Medicine Cabinet)
  version: 1.0.0
  description: '## Защищенный REST API веб-приложения «Семейная аптечка»


    Система предназначена для персонального и коллективного учёта лекарственных препаратов,
    контроля сроков годности (включая модель FEFO-Opened после вскрытия упаковки),
    составления расписаний курсов приёма и автоматизированной клинической поддержки
    принятия решений (CDS).


    ### Архитектурные механизмы информационной безопасности:

    - **Аутентификация:** Токены доступа Laravel Sanctum (Bearer токен в заголовке
    `Authorization: Bearer <token>`).

    - **Криптографическая защита Data-at-Rest:** Пароли пользователей хешируются с
    использованием алгоритма **Argon2id** (RFC 9106, memory-hard). Чувствительные
    медицинские поля (`notes`, `custom_trade_name`) шифруются симметричным шифром
    **AES-256-CBC**.

    - **Авторизация и противодействие IDOR:** Контроль доступа на уровне политик (Laravel
    Policies: `MedicineBoxPolicy`, `IntakeCoursePolicy`) и ролевая модель RBAC/ABAC
    (`owner`, `editor`, `viewer`).

    - **Защита от сетевых атак и перебора:** Дросселирование запросов (`throttle:login`
    — 5 попыток/мин на аутентификацию, `throttle:60,1` — защита каталога ГРЛС от скрапинга).

    - **Соответствие 152-ФЗ «О персональных данных»:** Обязательная фиксация согласия
    (`terms_accepted`), опциональная облачная синхронизация (`sync_enabled`), право
    на отзыв согласия и полное удаление данных (`Right to be Forgotten` / Soft-Delete
    аккаунта).

    - **Клиническая безопасность (Clinical Decision Support):** Предотвращение токсической
    передозировки при дублировании МНН, детекция непереносимости вспомогательных веществ/аллергенов
    и коморбидных противопоказаний.'
  contact:
    name: Маркова И. Б. (ФМиИТ, МГУ им. Н.П. Огарёва)
    email: markova@family.test
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
- url: http://e340043kek.temp.swtest.ru/api
  description: Боевой стенд HTTP (SpaceWeb Remote Stand - Direct HTTP)
- url: https://e340043kek.temp.swtest.ru/api
  description: Удаленный рабочий сервер HTTPS (SpaceWeb Remote Stand)
- url: http://127.0.0.1:8000/api
  description: Локальный сервер разработки (Local Development Artisan Serve)
tags:
- name: Auth
  description: Аутентификация, регистрация (152-ФЗ), профиль и управление жизненным
    циклом аккаунта
- name: Dashboard
  description: 'Сводная аналитика: приёмы на сегодня, критические сроки годности,
    активные курсы'
- name: Profiles
  description: Управление профилями членов семьи, аллергиями и хроническими диагнозами
- name: MedicineBoxes
  description: Управление семейными аптечками (Домашняя, Автомобильная, Детская, Дачная)
- name: MedicineBoxMembers
  description: Управление совместным семейным доступом к аптечке (Owner, Editor, Viewer)
- name: Medicines
  description: Учёт физических упаковок лекарств, остатков, сроков годности (FEFO)
    и шифрование (AES-256)
- name: ReferenceMedicines
  description: Публичный справочник лекарственных препаратов (ГРЛС/МНН) с защитой
    от скрапинга
- name: IntakeCourses
  description: Назначение курсов приёма и автогенерация расписания логов на 14 дней
- name: IntakeLogs
  description: 'Журнал приёмов лекарств: отметка о приёме (списание остатка), пропуск,
    перенос (snooze)'
- name: MedicationSafety
  description: Клинический аудит безопасности медикаментозного назначения (CDS)
- name: Notifications
  description: Системные уведомления о сроках годности и минимальных остатках
- name: Reports
  description: 'Аналитические отчёты: комплаенс, приверженность лечению (Adherence),
    непрерывные серии (streak)'
- name: Admin
  description: Административный мониторинг, блокировка пользователей и управление
    справочником ГРЛС
components:
  securitySchemes:
    sanctumAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer {token}
      description: 'Токен аутентификации Laravel Sanctum. Передается в заголовке `Authorization:
        Bearer <token>`.'
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: anna@family.test
        timezone:
          type: string
          example: Europe/Moscow
        sync_enabled:
          type: boolean
          example: true
        consent_version:
          type: string
          example: '1.0'
        consent_given_at:
          type: string
          format: date-time
          example: '2026-10-29T12:00:00Z'
    Profile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: Анна
        birth_date:
          type: string
          format: date
          nullable: true
          example: '1994-05-15'
        avatar_url:
          type: string
          nullable: true
          example: 👩
        notes:
          type: string
          nullable: true
          example: Основной профиль владельца
        allergies:
          type: array
          items:
            type: string
          example:
          - пенициллины
          - цитрусовые
          - лактоза
        chronic_conditions:
          type: array
          items:
            type: string
          example:
          - бронхиальная астма
          - гастрит
        active_courses_count:
          type: integer
          example: 2
    MedicineBox:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Домашняя аптечка
        box_type:
          type: string
          enum:
          - home
          - car
          - child
          - travel
          - custom
          example: home
        description:
          type: string
          nullable: true
          example: Основная домашняя аптечка в коридоре
        medicines_count:
          type: integer
          example: 5
        role:
          type: string
          enum:
          - owner
          - editor
          - viewer
          example: owner
        pivot:
          type: object
          properties:
            user_id:
              type: integer
              example: 1
            medicine_box_id:
              type: integer
              example: 1
            role:
              type: string
              enum:
              - owner
              - editor
              - viewer
              example: owner
    MedicineBoxMember:
      type: object
      properties:
        id:
          type: integer
          example: 2
        email:
          type: string
          format: email
          example: husband@family.test
        timezone:
          type: string
          example: Europe/Moscow
        pivot:
          type: object
          properties:
            role:
              type: string
              enum:
              - owner
              - editor
              - viewer
              example: editor
            invited_by_user_id:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
              example: '2026-10-27T10:00:00Z'
    ReferenceMedicine:
      type: object
      properties:
        id:
          type: integer
          example: 1
        trade_name:
          type: string
          example: Нурофен® Форте
        inn:
          type: string
          example: Ибупрофен
        dosage_form:
          type: string
          example: таблетки, покрытые оболочкой
        dosage:
          type: string
          example: 400 мг
        manufacturer:
          type: string
          example: Рекитт Бенкизер Хелскэр
        country:
          type: string
          example: Великобритания
        reg_number:
          type: string
          example: ЛП-002345
        barcode:
          type: string
          example: '5000158066228'
        atc_code:
          type: string
          example: M01AE01
        composition:
          type: string
          example: Ибупрофен 400 мг, натрия кроскармеллоза, лактозы моногидрат...
        allergen_tags:
          type: array
          items:
            type: string
          example:
          - lactose
          - nsaid
        instructions:
          type: object
          properties:
            indications:
              type: string
              example: Головная и зубная боль, лихорадочные состояния
            contraindications:
              type: string
              example: Эрозивно-язвенные заболевания ЖКТ, астма
            dosage_rules:
              type: string
              example: Взрослым по 1 таблетке до 3 раз в сутки после еды
        leaflet_pdf_url:
          type: string
          nullable: true
          example: https://grls.rosminzdrav.ru/leaflet/12345.pdf
        storage_condition:
          type: string
          enum:
          - room
          - fridge
          - dark_place
          example: room
        days_after_opening:
          type: integer
          nullable: true
          example: 180
        status:
          type: string
          example: active
    Medicine:
      type: object
      properties:
        id:
          type: integer
          example: 5
        medicine_box_id:
          type: integer
          example: 1
        reference_medicine_id:
          type: integer
          nullable: true
          example: 1
        custom_trade_name:
          type: string
          nullable: true
          example: Нурофен Форте
          description: Шифруется AES-256 в базе данных (Data-at-Rest)
        barcode:
          type: string
          nullable: true
          example: '5000158066228'
        quantity:
          type: number
          format: float
          example: 12.0
        quantity_unit:
          type: string
          enum:
          - pill
          - ml
          - mg
          - ampoule
          - unit
          example: pill
        expiration_date:
          type: string
          format: date
          example: '2027-12-31'
        opened_at:
          type: string
          format: date
          nullable: true
          example: '2026-10-01'
        days_after_opening:
          type: integer
          nullable: true
          example: 180
        effective_expiration_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-28'
          description: Вычисляемый эффективный срок годности (модель FEFO-Opened)
        low_stock_threshold:
          type: number
          format: float
          example: 2.0
        storage_condition:
          type: string
          enum:
          - room
          - fridge
          - dark_place
          example: room
        status:
          type: string
          enum:
          - active
          - expiring
          - expired
          - finished
          - disposed
          example: active
        notes:
          type: string
          nullable: true
          example: Принимать строго после еды
          description: Шифруется AES-256 в базе данных
        reference_medicine:
          $ref: '#/components/schemas/ReferenceMedicine'
    IntakeSchedule:
      type: object
      properties:
        id:
          type: integer
          example: 10
        intake_course_id:
          type: integer
          example: 3
        time_slot:
          type: string
          example: 08:00
        dosage_quantity:
          type: number
          format: float
          example: 1.0
    IntakeCourse:
      type: object
      properties:
        id:
          type: integer
          example: 3
        profile_id:
          type: integer
          example: 1
        medicine_id:
          type: integer
          example: 5
        title:
          type: string
          example: 'Курс: Нурофен Форте'
        start_date:
          type: string
          format: date
          example: '2026-10-29'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-11-12'
        dosage_quantity:
          type: number
          format: float
          example: 1.0
        dosage_instruction:
          type: string
          example: после еды
        notes:
          type: string
          nullable: true
          example: Запивать стаканом воды
        is_active:
          type: boolean
          example: true
        profile:
          $ref: '#/components/schemas/Profile'
        medicine:
          $ref: '#/components/schemas/Medicine'
        intake_schedules:
          type: array
          items:
            $ref: '#/components/schemas/IntakeSchedule'
    IntakeLog:
      type: object
      properties:
        id:
          type: integer
          example: 42
        intake_course_id:
          type: integer
          example: 3
        medicine_id:
          type: integer
          example: 5
        scheduled_time:
          type: string
          format: date-time
          example: '2026-10-29T08:00:00Z'
        taken_time:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-29T08:05:00Z'
        status:
          type: string
          enum:
          - scheduled
          - taken
          - skipped
          example: taken
        quantity_taken:
          type: number
          format: float
          example: 1.0
        skipped_reason:
          type: string
          nullable: true
          example: Повышенное давление
        intake_course:
          $ref: '#/components/schemas/IntakeCourse'
        medicine:
          $ref: '#/components/schemas/Medicine'
    NotificationLog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        type:
          type: string
          enum:
          - expiry_30_days
          - expiry_today
          - expired
          - opened_expired
          - low_stock
          example: opened_expired
        entity_id:
          type: integer
          example: 5
        message:
          type: string
          example: Срок годности препарата Нурофен истек после вскрытия.
        sent_at:
          type: string
          format: date-time
          example: '2026-10-29T08:00:00Z'
        channel:
          type: string
          example: in_app
    SafetyReport:
      type: object
      properties:
        safe:
          type: boolean
          example: false
        warnings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum:
                - critical
                - warning
                - info
                example: critical
              type:
                type: string
                example: duplicate_inn
              message:
                type: string
                example: 'Внимание! Обнаружено дублирование действующего вещества:
                  Ибупрофен.'
        checked_at:
          type: string
          format: date-time
          example: '2026-10-29T12:00:00Z'
        profile:
          type: object
        target:
          type: object
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Ошибка выполнения запроса.
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Переданные данные не прошли валидацию.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - Некорректный формат адреса электронной почты.
            terms_accepted:
            - Необходимо подтвердить согласие на обработку персональных данных (152-ФЗ).
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Регистрация нового пользователя (152-ФЗ)
      description: Создает пользователя с хешированием пароля через Argon2id, фиксирует
        согласие на обработку ПДн (152-ФЗ), автоматически создает семейный профиль
        и базовую «Домашнюю аптечку», выдает Bearer-токен Sanctum. Защищено Rate Limiter
        (5 попыток в минуту).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              - terms_accepted
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Анна Маркова
                email:
                  type: string
                  format: email
                  example: anna@family.test
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password
                password_confirmation:
                  type: string
                  format: password
                  minLength: 8
                  example: password
                timezone:
                  type: string
                  maxLength: 64
                  example: Europe/Moscow
                terms_accepted:
                  type: boolean
                  example: true
                  description: Обязательное согласие на обработку персональных данных
                    (152-ФЗ)
                sync_enabled:
                  type: boolean
                  example: true
                  description: Согласие на облачную синхронизацию и семейный шеринг
      responses:
        '201':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Регистрация успешно завершена.
                  token:
                    type: string
                    example: 1|qWeRtYuIoP123456789...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    $ref: '#/components/schemas/User'
                  profile:
                    $ref: '#/components/schemas/Profile'
                  default_box:
                    $ref: '#/components/schemas/MedicineBox'
        '422':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Превышен лимит запросов (Rate Limiter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Аутентификация пользователя (Argon2id)
      description: Проверяет учетные данные с использованием алгоритма Argon2id постоянного
        времени, защищает от брутфорса (throttle:login — не более 5 попыток в минуту)
        и возвращает токен Laravel Sanctum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: anna@family.test
                password:
                  type: string
                  format: password
                  example: password
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Успешная аутентификация
                  token:
                    type: string
                    example: 2|abcdef1234567890...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Превышен лимит попыток входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Информация о текущем пользователе
      security:
      - sanctumAuth: []
      responses:
        '200':
          description: Профиль авторизованного пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выход из системы (отзыв текущего токена)
      security:
      - sanctumAuth: []
      responses:
        '200':
          description: Успешный отзыв токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password:
    put:
      tags:
      - Auth
      summary: Смена пароля учетной записи
      description: Требует ввода текущего пароля для верификации (Argon2id), проверяет
        подтверждение нового пароля и обновляет хеш.
      security:
      - sanctumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                  example: password
                password:
                  type: string
                  minLength: 8
                  example: new_secure_password
                password_confirmation:
                  type: string
                  minLength: 8
                  example: new_secure_password
      responses:
        '200':
          description: Пароль успешно изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Неверный текущий пароль или ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/account:
    delete:
      tags:
      - Auth
      summary: Удаление учетной записи (152-ФЗ / Right to be Forgotten)
      description: Требует подтверждения паролем. Выполняет отзыв всех активных токенов
        Sanctum, каскадный Soft-Delete семейных профилей, аптечек и учетной записи
        пользователя.
      security:
      - sanctumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                current_password:
                  type: string
                  example: password
      responses:
        '200':
          description: Аккаунт и ПДн успешно удалены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Неверный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /auth/export:
    get:
      tags:
      - Auth
      summary: Выгрузка персональных данных субъекта (152-ФЗ РФ)
