  /intake-courses:
    get:
      tags:
      - IntakeCourses
      summary: Список курсов приёма лекарств с пагинацией
      description: Защита от IDOR. Возвращает курсы членов семьи текущего пользователя,
        с возможностью фильтрации по profile_id.
      security:
      - sanctumAuth: []
      parameters:
      - name: profile_id
        in: query
        required: false
        schema:
          type: integer
        description: Фильтр по члену семьи
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
        description: Только активные курсы
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Пагинированный список курсов
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntakeCourse'
                  total:
                    type: integer
                    example: 3
        '403':
          description: 'IDOR: Доступ к профилю запрещен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - IntakeCourses
      summary: Назначение курса приёма и автогенерация логов на 14 дней
      description: В атомарной транзакции создается курс (`intake_courses`), слоты
        расписания (`intake_schedules`) и логи приёмов на 14 дней вперед. Проводится
        аудит клинической безопасности (CDS) с возвратом предупреждений.
      security:
      - sanctumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - profile_id
              - medicine_id
              - start_date
              - dosage_quantity
              properties:
                profile_id:
                  type: integer
                  example: 1
                medicine_id:
                  type: integer
                  example: 5
                title:
                  type: string
                  example: Курс терапии при ОРВИ
                start_date:
                  type: string
                  format: date
                  example: '2026-10-29'
                end_date:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-11-05'
                dosage_quantity:
                  type: number
                  format: float
                  example: 1.0
                rule:
                  type: string
                  example: после еды
                dosage_instruction:
                  type: string
                  example: после еды, запивая водой
                time_slots:
                  type: array
                  items:
                    type: string
                    pattern: ^\d{1,2}:\d{2}$
                  example:
                  - 08:00
                  - '14:00'
                  - '20:00'
                notes:
                  type: string
                  example: Строго не натощак
      responses:
        '201':
          description: Курс назначен, расписание сгенерировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Курс приёма успешно назначен.
                  data:
                    $ref: '#/components/schemas/IntakeCourse'
                  logs_generated_count:
                    type: integer
                    example: 24
                  safety:
                    $ref: '#/components/schemas/SafetyReport'
                  warnings:
                    type: array
                    items:
                      type: object
        '403':
          description: 'IDOR: Профиль или лекарство не принадлежат пользователю'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации параметров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /intake-courses/{id}:
