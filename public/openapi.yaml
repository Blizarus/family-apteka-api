          description: Аналитический отчёт комплаенса
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      type:
                        type: string
                        example: 7_days
                      start_date:
                        type: string
                        format: date
                        example: '2026-10-26'
                      end_date:
                        type: string
                        format: date
                        example: '2026-11-01'
                  scheduled_count:
                    type: integer
                    example: 14
                  taken_count:
                    type: integer
                    example: 12
                  missed_count:
                    type: integer
                    example: 2
                  adherence_rate:
                    type: number
                    format: float
                    example: 85.7
                  streak_days:
                    type: integer
                    example: 5
                  daily_stats:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-10-26'
                        scheduled:
                          type: integer
                          example: 2
                        taken:
                          type: integer
                          example: 2
                        missed:
                          type: integer
                          example: 0
                  medicines_summary:
                    type: array
                    items:
                      type: object
                      properties:
                        medicine_id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Ибупрофен 400 мг
                        scheduled_count:
                          type: integer
                          example: 14
                        taken_count:
                          type: integer
                          example: 12
                        missed_count:
                          type: integer
                          example: 2
                        adherence_rate:
                          type: number
                          format: float
                          example: 85.7
